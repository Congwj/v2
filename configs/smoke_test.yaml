defaults: []

project: siu_pro_v2
experiment: smoke_test
wandb_mode: offline
ckpt_path: null
mode: train
seed: 0
ignore_warnings: true

trainer:
  max_epochs: 1
  accelerator: gpu
  strategy: auto
  devices: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  skip_sanity_check: true
  precision: "32"

optimizer:
  lr: 5e-4
  warm_up_epochs: 0
  weight_decay: 0.01

training:
  batch_size: 1
  num_epochs: 1
  weight_depth_smoothness: 0.05
  log_training_result_interval: 5
  feature_distill:
    enabled: true
    weight: 1.0
  use_vote_head: true
  dataloader:
    num_workers: 0
    pin_memory: false

model:
  image_size: [448, 448]
  device: cuda
  backbone:
    type: anysplat
    backbone: croco
    feature_dim: 2048
    freeze_encoder: true
    freeze_gaussian_head: true
    use_adapter: true
    adapter_dim: 64
    checkpoint: "src/pretrained_weights/model.safetensors"
    pred_head_type: depth
    encoder_params:
      enc_depth: 24
      enc_embed_dim: 1024
      patch_size: 16
  sam3:
    freeze_sam3: true
    freeze_sam3_backbone: true
    train_sam3_decoder: false
    skip_for_training: true
    num_classes: 1
    num_queries: 24
    checkpoint: "src/pretrained_weights/sam3.pt"
  gaussian_adapter:
    feature_dim: 2048
    sh_degree: 4
    num_points: 3000
    gaussian_scale_min: 0.01
    gaussian_scale_max: 0.3
    voxel_size: 0.02

data:
  dataset_root: /data3/congwenjie/dataset/SIU3R_DATASET
  split: train
  num_views: 3
  pool_size: 20
  min_view_gap: 3
  max_train_samples: 8
  max_val_samples: 4
